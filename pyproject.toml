[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcc-skill-runtime"
version = "0.1.0"
description = "按需加载 DCC Skill、管理会话并调用 Host Service 的运行时"
requires-python = ">=3.10,<3.11"
dependencies = [
    "cryptography>=42,<45",
    "PyYAML>=6,<7",
    "websockets>=13,<16",
    "mcp>=1.28,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
