name: Runtime CI and versioning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: runtime-version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Validate commit prefixes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            python dev/release_version.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          } else {
            python dev/release_version.py --base "${{ github.event.before }}" --head "${{ github.sha }}"
          }
      - name: Install and test Runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r runtime-requirements.txt pytest
          $env:PYTHONPATH = "src"
          python -m pytest -q

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Calculate and apply version
        id: bump
        shell: pwsh
        run: |
          $version = python dev/release_version.py --base "${{ github.event.before }}" --head "${{ github.sha }}" --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Commit version and tag
        if: steps.bump.outputs.version != 'no-release'
        shell: pwsh
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore(release): $env:VERSION [skip ci]"
          git tag "v$env:VERSION"
          git push origin HEAD:main "v$env:VERSION"
